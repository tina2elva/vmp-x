name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------- Windows/amd64
  windows-amd64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: toolchain (msys2 UCRT64 - gcc, objdump, ld)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          # mingw-w64-i686-gcc: the 32-bit (PE32) path needs an i686 compiler; the gate below
          # runs with VMP_REQUIRE_I686=1, so a missing toolchain is a hard failure here.
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-i686-gcc
      - name: 32-bit payload (i686 blob + PE32 pack vs native)
        shell: pwsh
        env:
          VMP_REQUIRE_I686: "1"
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          go build -o build/vmpbuild.exe ./cmd/vmpbuild
          go build -o build/vmpack.exe ./cmd/vmpack
          $msys = "${{ steps.msys2.outputs.msys2-location }}"
          if (-not $msys -or -not (Test-Path $msys)) { $msys = "C:\msys64" }
          $env:PATH = "$msys\mingw32\bin;" + $env:PATH
          & powershell -NoProfile -ExecutionPolicy Bypass -File tools/e2e_32bit.ps1
          if ($LASTEXITCODE -ne 0) { throw "32-bit payload gate failed (exit $LASTEXITCODE)" }
      - name: Go gates
        shell: pwsh
        run: |
          go build ./...
          go test ./...
          gofmt -l .
          go vet ./...
      - name: E2E x86-64 (146 cases)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          $msys = "${{ steps.msys2.outputs.msys2-location }}"
          if (-not $msys -or -not (Test-Path $msys)) { $msys = "C:\msys64" }
          $goDir = Split-Path (Get-Command go -ErrorAction SilentlyContinue).Source
          $env:PATH = "$goDir;$msys\ucrt64\bin;$msys\usr\bin;" + $env:PATH
          Write-Host "::notice::msys=$msys go=$goDir gcc=$((Get-Command gcc -ErrorAction SilentlyContinue).Source)"
          $log = "build/ci_step.log"
          & powershell -NoProfile -ExecutionPolicy Bypass -File tools/e2e.ps1 *>&1 | Tee-Object -FilePath $log
          $rc = $LASTEXITCODE
          if ($rc -ne 0) {
            # 关键行优先：注解会被截断，先放 [FAIL]/崩溃/fatal 行，再放尾部几行，
            # 否则 runner 上"到底哪个用例失败"会被埋在长日志里（前几轮就吃过这个亏）。
            $fails = @(Select-String -Path $log -Pattern "\[FAIL\]|E2EFAIL|diag:|MISMATCH|<crash|fatal error|\[!\]|panicked|LOAD |payloadVA=|bss 在 payload|VMRING01|core_pattern|pc=0x|core:" -ErrorAction SilentlyContinue | Select-Object -First 12 | ForEach-Object { $_.Line })
            $tail = @(Get-Content $log -Tail 4 -ErrorAction SilentlyContinue)
            $msg = (($fails + $tail) -join "%0A") -replace "%", "%25"
            $msg = $msg -replace [char]13, ""
            Write-Host "::error title=E2E x86-64 (146 cases) (exit $rc)::$msg"
            exit $rc
          }

      - name: E2E DLL (3 cases)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          $msys = "${{ steps.msys2.outputs.msys2-location }}"
          if (-not $msys -or -not (Test-Path $msys)) { $msys = "C:\msys64" }
          $goDir = Split-Path (Get-Command go -ErrorAction SilentlyContinue).Source
          $env:PATH = "$goDir;$msys\ucrt64\bin;$msys\usr\bin;" + $env:PATH
          Write-Host "::notice::msys=$msys go=$goDir gcc=$((Get-Command gcc -ErrorAction SilentlyContinue).Source)"
          $log = "build/ci_step.log"
          & powershell -NoProfile -ExecutionPolicy Bypass -File tools/e2e_dll.ps1 *>&1 | Tee-Object -FilePath $log
          $rc = $LASTEXITCODE
          if ($rc -ne 0) {
            # 关键行优先：注解会被截断，先放 [FAIL]/崩溃/fatal 行，再放尾部几行，
            # 否则 runner 上"到底哪个用例失败"会被埋在长日志里（前几轮就吃过这个亏）。
            $fails = @(Select-String -Path $log -Pattern "\[FAIL\]|MISMATCH|<crash|fatal error|\[!\]|panicked|LOAD |payloadVA=|bss 在 payload|VMRING01|core_pattern|pc=0x|core:" -ErrorAction SilentlyContinue | Select-Object -First 12 | ForEach-Object { $_.Line })
            $tail = @(Get-Content $log -Tail 4 -ErrorAction SilentlyContinue)
            $msg = (($fails + $tail) -join "%0A") -replace "%", "%25"
            $msg = $msg -replace [char]13, ""
            Write-Host "::error title=E2E DLL (3 cases) (exit $rc)::$msg"
            exit $rc
          }

      - name: ARM64 guest differential (host is still x86-64)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          $msys = "${{ steps.msys2.outputs.msys2-location }}"
          if (-not $msys -or -not (Test-Path $msys)) { $msys = "C:\msys64" }
          $goDir = Split-Path (Get-Command go -ErrorAction SilentlyContinue).Source
          $env:PATH = "$goDir;$msys\ucrt64\bin;$msys\usr\bin;" + $env:PATH
          Write-Host "::notice::msys=$msys go=$goDir gcc=$((Get-Command gcc -ErrorAction SilentlyContinue).Source)"
          $log = "build/ci_step.log"
          & powershell -NoProfile -ExecutionPolicy Bypass -File tools/e2e_arm64guest.ps1 *>&1 | Tee-Object -FilePath $log
          $rc = $LASTEXITCODE
          if ($rc -ne 0) {
            # 关键行优先：注解会被截断，先放 [FAIL]/崩溃/fatal 行，再放尾部几行，
            # 否则 runner 上"到底哪个用例失败"会被埋在长日志里（前几轮就吃过这个亏）。
            $fails = @(Select-String -Path $log -Pattern "\[FAIL\]|MISMATCH|<crash|fatal error|\[!\]|panicked|LOAD |payloadVA=|bss 在 payload|VMRING01|core_pattern|pc=0x|core:" -ErrorAction SilentlyContinue | Select-Object -First 12 | ForEach-Object { $_.Line })
            $tail = @(Get-Content $log -Tail 4 -ErrorAction SilentlyContinue)
            $msg = (($fails + $tail) -join "%0A") -replace "%", "%25"
            $msg = $msg -replace [char]13, ""
            Write-Host "::error title=ARM64 guest differential (host is still x86-64) (exit $rc)::$msg"
            exit $rc
          }

      - name: Linux payload executed on Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          $msys = "${{ steps.msys2.outputs.msys2-location }}"
          if (-not $msys -or -not (Test-Path $msys)) { $msys = "C:\msys64" }
          $goDir = Split-Path (Get-Command go -ErrorAction SilentlyContinue).Source
          $env:PATH = "$goDir;$msys\ucrt64\bin;$msys\usr\bin;" + $env:PATH
          Write-Host "::notice::msys=$msys go=$goDir gcc=$((Get-Command gcc -ErrorAction SilentlyContinue).Source)"
          $log = "build/ci_step.log"
          & powershell -NoProfile -ExecutionPolicy Bypass -File tools/verify_linux_payload.ps1 *>&1 | Tee-Object -FilePath $log
          $rc = $LASTEXITCODE
          if ($rc -ne 0) {
            # 关键行优先：注解会被截断，先放 [FAIL]/崩溃/fatal 行，再放尾部几行，
            # 否则 runner 上"到底哪个用例失败"会被埋在长日志里（前几轮就吃过这个亏）。
            $fails = @(Select-String -Path $log -Pattern "\[FAIL\]|MISMATCH|<crash|fatal error|\[!\]|panicked|LOAD |payloadVA=|bss 在 payload|VMRING01|core_pattern|pc=0x|core:" -ErrorAction SilentlyContinue | Select-Object -First 12 | ForEach-Object { $_.Line })
            $tail = @(Get-Content $log -Tail 4 -ErrorAction SilentlyContinue)
            $msg = (($fails + $tail) -join "%0A") -replace "%", "%25"
            $msg = $msg -replace [char]13, ""
            Write-Host "::error title=Linux payload executed on Windows (exit $rc)::$msg"
            exit $rc
          }

  # ---------------------------------------------------------------- Linux/amd64
  linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: deps (gcc / binutils / readelf)
        run: sudo apt-get update && sudo apt-get install -y gcc binutils file
      - name: Go gates
        run: |
          go build ./...
          go test ./...
          gofmt -l .
          go vet ./...
      - name: payload probe (payload mapped at its original VA, on Linux)
        run: |
          mkdir -p build
          set +e
          bash tools/verify_linux_payload.sh > build/ci_step.log 2>&1
          rc=$?
          tail -n 40 build/ci_step.log
          if [ $rc -ne 0 ]; then
            msg=$( (grep -E '\[FAIL\]|MISMATCH|<crash|fatal error|panicked|\[!\]|LOAD |payloadVA=|bss 在 payload|VMRING01|core_pattern|pc=0x|core:' build/ci_step.log | head -n 12; tail -n 4 build/ci_step.log) | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=verify_linux_payload.sh (exit $rc)::$msg"
          fi
          exit $rc
      - name: ELF end-to-end (readelf must show no W+X)
        run: |
          mkdir -p build
          set +e
          bash tools/e2e.sh > build/ci_step.log 2>&1
          rc=$?
          tail -n 40 build/ci_step.log
          if [ $rc -ne 0 ]; then
            msg=$( (grep -E '\[FAIL\]|MISMATCH|<crash|fatal error|panicked|\[!\]|LOAD |payloadVA=|bss 在 payload|VMRING01|core_pattern|pc=0x|core:' build/ci_step.log | head -n 12; tail -n 4 build/ci_step.log) | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=bash tools/e2e.sh (exit $rc)::$msg"
          fi
          exit $rc
      - name: ELF image encryption e2e (entry self-decrypt, Linux)
        run: |
          set -o pipefail
          bash tools/e2e_elf_image.sh --strict 2>&1 | tee build/elf_image_e2e.log

  # ---------------------------------------------------------------- Linux/arm64 (qemu-user)
  linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: deps (aarch64 cross toolchain + qemu-user)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu qemu-user
      - name: Linux/arm64 end-to-end (qemu-aarch64)
        run: |
          mkdir -p build
          set +e
          CC=aarch64-linux-gnu-gcc OBJDUMP=aarch64-linux-gnu-objdump QEMU=qemu-aarch64 bash tools/e2e_arm64.sh > build/ci_step.log 2>&1
          rc=$?
          tail -n 40 build/ci_step.log
          if [ $rc -ne 0 ]; then
            msg=$( (grep -E '\[FAIL\]|MISMATCH|<crash|fatal error|panicked|\[!\]|LOAD |payloadVA=|bss 在 payload|VMRING01|core_pattern|pc=0x|core:' build/ci_step.log | head -n 12; tail -n 4 build/ci_step.log) | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=CC=aarch64-linux-gnu-gcc OBJDUMP=aarch64-linux-gnu-objdump QEMU=qemu-aarch64 bash tools/e2e_arm64.sh (exit $rc)::$msg"
          fi
          exit $rc

      - name: ELF image encryption e2e (aarch64, entry self-decrypt, qemu)
        # 与既有的 arm64 e2e 用同一套环境变量：vmpbuild 的**汇编**那一步走的是环境里的 CC，
        # 只给 -cc 的话 .S 会被宿主的 gcc/as 编成 x86-64，链接时报
        # "linux_arm64_vm_entry_asm.S.o: error adding symbols: file in wrong format"（CI 现场）。
        env:
          CC: aarch64-linux-gnu-gcc
          OBJDUMP: aarch64-linux-gnu-objdump
        run: |
          set -o pipefail
          BLOB_SRC=stub/linux/arm64 BLOB_CC=aarch64-linux-gnu-gcc BLOB_GUEST=arm64 \
          BLOB_EXTRA="-merge go -random-opcodes=false -objdump aarch64-linux-gnu-objdump" \
          GOARCH_TARGET=arm64 QEMU=qemu-aarch64 TAG=a64 \
          EXPOSE_SECTIONS=".text" \
            bash tools/e2e_elf_image.sh --strict 2>&1 | tee build/elf_image_e2e_a64.log

  # ---------------------------------------------------------------- Windows/arm64: blob build（clang + aarch64-w64-windows-gnu）
  # 以前这里找的是 aarch64-w64-mingw32-gcc（apt 里没有）→ 长期是「已知缺口」。
  # clang/LLVM 自带 aarch64 的 COFF 后端，而 blob 是 freestanding（不 include 任何系统头），
  # 所以不需要 mingw sysroot：clang --target=aarch64-w64-windows-gnu -c 就能产出 aarch64 COFF；
  # 合并走内置合并器（-merge go），不需要 ld。
  # 说明：若还想验证「运行」这一半，可改用 GitHub 的 windows-11-arm 原生 runner（arm64 Windows），
  #   那样能在本机直接跑打包后的 arm64 PE；本作业只负责 blob 构建这一半。
  windows-arm64-blob:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm >/dev/null
          llvm-objdump --version | head -n 2 || true
          clang --version | head -n 1
          clang -dumpmachine || true
          command -v objdump || true
      - name: build Windows/arm64 blob
        run: |
          set -e
          mkdir -p build
          go build -o build/vmpbuild ./cmd/vmpbuild
          printf '#!/bin/sh\nexec clang --target=aarch64-w64-windows-gnu "$@"\n' > build/clang-a64w
          chmod +x build/clang-a64w
          set +e
          ./build/vmpbuild -src stub/win/arm64 -out build/vm_interp_win_arm64.bin \
            -manifest build/vm_interp_win_arm64.json -entry vm_entry -guest arm64 -merge go \
            -cc "$PWD/build/clang-a64w" -objdump llvm-objdump > build/ci_step.log 2>&1
          rc=$?
          tail -n 25 build/ci_step.log
          if [ $rc -ne 0 ]; then
            msg=$(tail -n 18 build/ci_step.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Windows/arm64 blob build (exit $rc)::$msg"
            exit $rc
          fi
          ls -l build/vm_interp_win_arm64.bin
          grep -E 'guest|regCount|blobSize' build/vm_interp_win_arm64.json | head -n 3
      - name: build an arm64 PE target (freestanding; no Windows SDK required)
        run: |
          sudo apt-get install -y -qq lld >/dev/null
          if ! clang --target=aarch64-w64-windows-gnu -O1 -fno-tree-vectorize -nostdlib \
              -fuse-ld=lld -Wl,-e,entry -Wl,-subsystem=console -g \
              -o build/target_arm64.exe testdata/arm64/target_win.c > build/pe_step.log 2>&1; then
            tail -n 20 build/pe_step.log
            echo "::error title=arm64 PE target build::$(tail -n 12 build/pe_step.log | sed -e 's/%/%25/g' | tr '\n' '|')"
            exit 1
          fi
          ls -l build/target_arm64.exe
      - name: pack Windows/arm64 (structure check)
        run: |
          go build -o build/vmpack ./cmd/vmpack
          if ! ./build/vmpack -exe build/target_arm64.exe -func check_key -func sum_to \
              -blob build/vm_interp_win_arm64.bin -manifest build/vm_interp_win_arm64.json \
              -out build/target_arm64.vmp -report build/target_arm64_vmp.json > build/pack_step.log 2>&1; then
            tail -n 20 build/pack_step.log
            echo "::error title=Windows/arm64 pack::$(tail -n 12 build/pack_step.log | sed -e 's/%/%25/g' | tr '\n' '|')"
            exit 1
          fi
          tail -n 12 build/pack_step.log
          grep -o '"entryPatch":"[^"]*"' build/target_arm64_vmp.json | head -n 2
          grep -q 'F0 03 1E AA' build/target_arm64_vmp.json || { echo "::error title=arm64 entry patch::入口补丁不是 mov x16,x30;b thunk"; exit 1; }
          echo "[+] Windows/arm64 打包结构检查通过"

  # ---------------------------------------------------------------- Windows/arm64: 原生 arm64 Windows 上真跑
  # GitHub 的 windows-11-arm 原生镜像自带 clang/LLVM 与 Windows SDK，可以在本机编 blob、编 PE 目标、
  # 打包，然后 native 与打包后各跑一次比对退出码 —— 这是 Windows/arm64 唯一能证明「执行」的一半。
  # 标签若对本仓库不可用，作业会直接报 label 不支持（见 .github/actionlint.yaml 的说明）。
  windows-arm64-run:
    runs-on: windows-11-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: toolchain
        shell: pwsh
        run: |
          clang -dumpmachine
          go version
          $od = (Get-Command llvm-objdump -ErrorAction SilentlyContinue).Source
          Write-Host "::notice::objdump=$($od)"
      - name: build blob + target + pack
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          go build -o build/vmpbuild.exe ./cmd/vmpbuild; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -o build/vmpack.exe ./cmd/vmpack; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $od = (Get-Command llvm-objdump -ErrorAction SilentlyContinue).Source
          if (-not $od) { $od = "objdump" }
          $steps = @(
            ,@("./build/vmpbuild.exe", "-src", "stub/win/arm64", "-out", "build/vm_interp_win_arm64.bin", "-manifest", "build/vm_interp_win_arm64.json", "-entry", "vm_entry", "-guest", "arm64", "-merge", "go", "-cc", "clang", "-objdump", $od)
            ,@("clang", "--target=aarch64-w64-windows-gnu", "-fuse-ld=lld", "-O1", "-fno-tree-vectorize", "-nostdlib", "-Wl,-e,entry", "-Wl,-subsystem=console", "-g", "-o", "build/target_arm64.exe", "testdata/arm64/target_win.c")
            ,@("./build/vmpack.exe", "-exe", "build/target_arm64.exe", "-func", "check_key", "-func", "sum_to", "-blob", "build/vm_interp_win_arm64.bin", "-manifest", "build/vm_interp_win_arm64.json", "-out", "build/target_arm64.vmp", "-report", "build/target_arm64_vmp.json")
          )
          foreach ($s in $steps) {
            & $s[0] $s[1..($s.Length - 1)] 2>&1 | Tee-Object -FilePath build/step.log
            if ($LASTEXITCODE -ne 0) {
              $tail = (Get-Content build/step.log -Tail 14) -join "%0A"
              Write-Host "::error title=$($s[0]) exit $LASTEXITCODE::$tail"
              exit $LASTEXITCODE
            }
          }
          Get-Item build/vm_interp_win_arm64.bin, build/target_arm64.exe, build/target_arm64.vmp | ForEach-Object { "$($_.Name): $($_.Length) bytes" }
            # 文件级断言（这就是 PE/arm64 的专属 e2e 两半之一；另一半是下面 native vs protected 的退出码比对）：
            # 原镜像 .text/.rdata/.data 的非零 64B 块必须 0 命中 —— 与 ELF 侧 tools/e2e_elf_image.sh 同义。
            python tools/image_residue.py --src build/target_arm64.exe --packed build/target_arm64.vmp --section .text,.rdata,.data --allow-missing
            if ($LASTEXITCODE -ne 0) { Write-Host "::error title=Windows/arm64 image residue::original code still readable"; exit 1 }
            Write-Host "[+] Windows/arm64 文件级残留检查通过（0 命中）"
      - name: run native vs protected
        shell: pwsh
        run: |
          $nrc = 0; & .\build\target_arm64.exe; $nrc = $LASTEXITCODE
          $prc = 0; & .\build\target_arm64.vmp; $prc = $LASTEXITCODE
          $nc = ('0x{0:X8}' -f [uint32]$nrc); $pc = ('0x{0:X8}' -f [uint32]$prc)
          Write-Host "native rc=$nrc ($nc)  protected rc=$prc ($pc)"
          if ($nrc -ne $prc) {
            Write-Host "::error title=Windows/arm64 mismatch::native=$nrc ($nc) protected=$prc ($pc)"
            exit 1
          }
          Write-Host "::notice title=Windows/arm64 OK::native=$nrc protected=$prc"
          Write-Host "[+] Windows/arm64 end-to-end: outputs match"
          # 关键：GitHub 的 pwsh 包装器最后会 `exit $LASTEXITCODE`，而这里 $LASTEXITCODE 还是
          # 被保护程序自己的退出码（非 0）——不显式清零，比较通过了步骤也会被判失败。
          # Second run of the SAME product from this (previously succeeding) step - STATUS #505:
          # the same file returns 0x26FE11B5 here but 0xC0DE0002 in the very next step of this job.
          $rr = 0; & .\build\target_arm64.vmp; $rr = $LASTEXITCODE
          Write-Host ("[*] green step: second run of target_arm64.vmp -> rc=" + $rr)
          # Same product again, but launched the way my step launches it (ShellExecute path via
          # Start-Process). STATUS #506: if this FAILS while the plain call above succeeds, then the
          # trigger is the launcher => ASLR active => win/arm64 product lacks a relocation table.
          $soG = Join-Path $PWD "build/green_sp.out"
          $seG = Join-Path $PWD "build/green_sp.err"
          $rr2 = -999
          try { $pg = Start-Process -FilePath (Join-Path $PWD "build/target_arm64.vmp") -Wait -PassThru -RedirectStandardOutput $soG -RedirectStandardError $seG; $rr2 = $pg.ExitCode } catch { $rr2 = -998 }
          Write-Host ("[*] green step: same product via Start-Process -> rc=" + $rr2)
          $global:LASTEXITCODE = 0
      - name: 1b external master key (win/arm64 relocation diagnosis)
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File tools/e2e_win_arm64.ps1
          Write-Host "probe step exit=$LASTEXITCODE"
          Write-Host "--- build/probe.txt ---"
          if (Test-Path build/probe.txt) { Get-Content build/probe.txt | ForEach-Object { Write-Host ("  TRACE| " + $_) } }
          $global:LASTEXITCODE = 0