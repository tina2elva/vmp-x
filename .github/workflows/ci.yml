name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------- Windows/amd64
  windows-amd64:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: 工具链（msys2 UCRT64：gcc/objdump/ld）
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Go 门禁
        run: |
          go build ./...
          go test ./...
          gofmt -l .
          go vet ./...
      - name: 真机 E2E（x86-64）
        run: pwsh -File tools/e2e.ps1
      - name: 真机 E2E（DLL）
        run: pwsh -File tools/e2e_dll.ps1

  # ---------------------------------------------------------------- Linux/amd64
  linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: 依赖（gcc/binutils/readelf）
        run: sudo apt-get update && sudo apt-get install -y gcc binutils
      - name: Go 门禁
        run: |
          go build ./...
          go test ./...
          gofmt -l .
          go vet ./...
      - name: ELF 端到端（含"不得有 W+X 段"断言）
        run: bash tools/e2e.sh

  # ---------------------------------------------------------------- Linux/arm64 (qemu)
  linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: 依赖（aarch64 交叉工具链 + qemu-user）
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu qemu-user
      - name: Linux/arm64 端到端（qemu-aarch64）
        run: |
          CC=aarch64-linux-gnu-gcc OBJDUMP=aarch64-linux-gnu-objdump QEMU=qemu-aarch64 \
            bash tools/e2e_arm64.sh

  # ---------------------------------------------------------------- Windows/arm64（只构建 blob）
  windows-arm64-blob:
    runs-on: ubuntu-latest   # 用 Linux 上的 aarch64-w64-mingw32 交叉工具链产出 COFF 目标
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: 依赖（aarch64-w64-mingw32 交叉工具链）
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 || true
          # 说明：Windows/arm64 的 blob 需要一个能产出 aarch64 COFF 的编译器。
          # 若 CI 镜像不提供，这一步会失败 —— 失败信息会明确写出缺哪个工具，而不是静默跳过。
      - name: 构建 Windows/arm64 blob
        run: |
          go build -o build/vmpbuild ./cmd/vmpbuild
          ./build/vmpbuild -src stub/win/arm64 \
            -out build/vm_interp_win_arm64.bin -manifest build/vm_interp_win_arm64.json \
            -entry vm_entry -guest arm64 \
            -cc aarch64-w64-mingw32-gcc -objdump aarch64-w64-mingw32-objdump
  # ---------------------------------------------------------------- ARM64 客户机语义（宿主仍是 x86-64）
  # 这不是 arm64 宿主：它用 x86-64 宿主 blob 承载 arm64 客户机字节码，验证
  # lifter → 字节码 → C 解释器 这条链的客户机语义（借位/条件码/寄存器窗口）。
  # 本机（Windows）已通过；CI 侧用 linux/amd64 stub 走同一配方，尚未实跑。
  arm64-guest-differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: 构建 arm64 客户机 blob + harness
        run: |
          go build -o build/vmpbuild ./cmd/vmpbuild
          ./build/vmpbuild -src stub/linux/amd64 -out build/vm_interp_a64g.bin \
            -manifest build/vm_interp_a64g.json -entry vm_entry -guest arm64 -random-opcodes=false
          gcc -O1 -Wall -DVM_GUEST_ARM64=1 -DVM_REG_COUNT=35 -I stub/win/x64 \
            -o build/runbc_a64g.exe stub/win/x64/blob_probe.c
      - name: ARM64 客户机语义差分
        run: |
          go test ./internal/lift/arm64/ -run TestArm64GuestInCInterpreter -v
          go test ./internal/vm/ -run TestGuestSemantics -v