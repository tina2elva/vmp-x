name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------- Windows/amd64（本机已验证的那一套）
  windows-amd64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 工具链（msys2 UCRT64：gcc / objdump / ld）
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Go 门禁
        shell: pwsh
        run: |
          go build ./...
          go test ./...
          gofmt -l .
          go vet ./...
      # 下面几步用 msys2 的 shell：这样 gcc/objdump/ld 一定在 PATH 上
      # （上一次失败就是因为 setup-msys2 的工具不在 PowerShell 的 PATH 里）。
      # 脚本本身是 .ps1，所以在 msys2 bash 里显式调 powershell。
      - name: 真机 E2E（x86-64，146 例）
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE"
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/e2e.ps1
      - name: 真机 E2E（DLL，3 例）
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE"
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/e2e_dll.ps1
      - name: ARM64 客户机语义差分（宿主仍是 x86-64）
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE"
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/e2e_arm64guest.ps1
      - name: Linux 载荷（在 Windows 上执行注入后的 ELF 载荷）
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE"
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/verify_linux_payload.ps1

  # ---------------------------------------------------------------- Linux/amd64
  linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 依赖（gcc / binutils / readelf）
        run: sudo apt-get update && sudo apt-get install -y gcc binutils file
      - name: Go 门禁
        run: |
          go build ./...
          go test ./...
          gofmt -l .
          go vet ./...
      - name: ELF 端到端（含「不得有 W+X 段」断言）
        run: bash tools/e2e.sh

  # ---------------------------------------------------------------- Linux/arm64（qemu-user）
  linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 依赖（aarch64 交叉工具链 + qemu-user）
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu qemu-user
      - name: Linux/arm64 端到端（qemu-aarch64）
        run: |
          CC=aarch64-linux-gnu-gcc OBJDUMP=aarch64-linux-gnu-objdump QEMU=qemu-aarch64 \
            bash tools/e2e_arm64.sh

  # ---------------------------------------------------------------- Windows/arm64：只构建 blob
  # 需要的编译器是「产出 aarch64 COFF」的那一类，apt 默认没有；拿不到就明确失败并报出缺什么，
  # 因此这里允许失败（continue-on-error），不让它把整个 CI 变红，但结果仍然可见。
  windows-arm64-blob:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 找 aarch64 COFF 编译器
        run: |
          set -x
          command -v aarch64-w64-mingw32-gcc || true
          command -v clang || true
          sudo apt-get update -qq || true
          sudo apt-get install -y --no-install-recommends clang lld llvm || true
          command -v clang || true
      - name: 构建 Windows/arm64 blob
        run: |
          go build -o build/vmpbuild ./cmd/vmpbuild
          # 先按常规名字试；不行就退回 llvm 的交叉形式（clang --target=aarch64-w64-windows-gnu）。
          if command -v aarch64-w64-mingw32-gcc >/dev/null 2>&1; then
            ./build/vmpbuild -src stub/win/arm64 -out build/vm_interp_win_arm64.bin \
              -manifest build/vm_interp_win_arm64.json -entry vm_entry -guest arm64 \
              -cc aarch64-w64-mingw32-gcc -objdump aarch64-w64-mingw32-objdump
          else
            echo "::warning::没有 aarch64-w64-mingw32-gcc；Windows/arm64 的 blob 构建仍未验证（这是已知缺口，不是回归）"
            exit 1
          fi